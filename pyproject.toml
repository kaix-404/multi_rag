[tool.poetry]
name = "mmrag"
version = "0.1.0"
description = "Multimodal Hybrid RAG Engine — dense/sparse hybrid retrieval with vision-language reranking for financial & technical documents"
authors = ["Capstone Team <capstone@example.com>"]
readme = "README.md"
packages = [{ include = "mmrag", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pymupdf = "^1.24"
pdfplumber = "^0.11"
numpy = ">=1.26"
pillow = ">=10"
rank-bm25 = "^0.2.2"
qdrant-client = ">=1.12"
fastapi = ">=0.115"
uvicorn = ">=0.30"
streamlit = ">=1.38"
httpx = ">=0.27"
python-multipart = ">=0.0.9"

[tool.poetry.extras]
models = ["sentence-transformers", "transformers", "torch", "sentencepiece"]
eval = ["ragas"]

[tool.poetry.group.models.dependencies]
sentence-transformers = { version = ">=3.0", optional = true }
transformers = { version = ">=4.44", optional = true }
torch = { version = ">=2.2", optional = true }
sentencepiece = { version = ">=0.2", optional = true }

[tool.poetry.group.eval.dependencies]
ragas = { version = ">=0.2", optional = true }

[tool.poetry.scripts]
mmrag = "mmrag.cli:main"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
